services:
  postgres:
    image: pgvector/pgvector:pg17

    container_name: supportsense-postgres

    environment:
      POSTGRES_USER: supportsense
      POSTGRES_PASSWORD: password
      POSTGRES_DB: supportsense

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack
    container_name: supportsense-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in the repo-root .env file}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d:ro

volumes:
  postgres_data:
  localstack_data:
